<style>
/* Print on Letter at Actual size / 100%, then cut on the dotted line (6 x 3 in).
   Backup white QR patch: 2026-qr.html */
@page { size: letter; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Instrument Sans", system-ui, sans-serif; color: #111; background: #ddd; }
.sheet { width: 6in; height: 3in; position: relative; overflow: hidden; background: #fff;
         margin: .75in auto 0; outline: 1px dotted #111; outline-offset: 0; }
@media print { body { background: none; } .sheet { background: none; } .screen-only { display: none; } }
body.kraft .sheet { background: #c4a27a; }   /* on-screen kraft simulation only */

/* Tag */
.tag { display: grid; grid-template-columns: 1fr 1.8in; gap: .25in; align-items: center;
        padding: .3in .7in; }
/* String-hole marks: an X at both ends, a third of the way down (two-thirds toward the top) */
.hole { position: absolute; top: 1in; width: .16in; height: .16in; margin-top: -.08in; }
.hole::before, .hole::after { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 100%;
         margin-left: -.5px; background: #111; }
.hole::before { transform: rotate(45deg); } .hole::after { transform: rotate(-45deg); }
.hole.left { left: .27in; } .hole.right { right: .27in; }
.event { font-size: 8.5pt; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 .06in; }
h1 { font-size: 23pt; font-weight: 650; letter-spacing: -.02em; line-height: 1; margin: 0 0 .12in; }
.scan { font-size: 10.5pt; font-weight: 500; margin: 0 0 .16in; white-space: nowrap; }
.bottles { font-size: 9pt; line-height: 1.45; margin: 0; padding: .1in 0 0; border-top: 1px solid #111; }
.bottles span { display: block; }
.qr { text-align: center; }
.qr svg { width: 1.6in; height: 1.6in; display: block; margin: 0 auto; }
.url { font-size: 7.5pt; margin-top: .07in; letter-spacing: .01em; }


.controls { font: 13px system-ui; text-align: center; padding: 10px; }
</style>
</head>
